# Tests every push and pull request, then publishes main to GitHub Pages.
# There is no build step: the deploy job copies only the files the browser
# needs (index.html, assets/, css/, js/) into the Pages artifact, so README,
# docs, screenshots and tests stay out of the public site.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Node 22+ is needed for its built-in WebSocket client; no npm install.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Show the browser version
        run: google-chrome --version

      # Browser unit tests plus smoke tests of the real app, in the Google
      # Chrome that the runner image already includes.
      - name: Run the tests
        run: node --test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    # One deployment at a time; a newer push waits instead of cancelling a
    # deployment that is already in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Collect the site files
        run: |
          mkdir _site
          cp -r index.html assets css js _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
