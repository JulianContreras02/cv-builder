# Publishes the static site to GitHub Pages on every push to main.
# There is no build step: the job copies only the files the browser needs
# (index.html, assets/, css/, js/) into the Pages artifact, so README, docs and
# screenshots stay out of the public site.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling a
# deployment that is already in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Collect the site files
        run: |
          mkdir _site
          cp -r index.html assets css js _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
